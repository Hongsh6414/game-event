name: Test Workflow          # ① 이 워크플로우의 이름 (Actions 탭에 표시됨)

on:                          # ② 언제 실행할지 (트리거)
  push:
    branches: [main]         # main 브랜치에 push될 때 실행

jobs:                        # ③ 실행할 작업들
  hello:                     # 작업 이름(임의로 지음)
    runs-on: ubuntu-latest    # 이 작업을 실행할 가상머신(러너) 종류
    steps:                    # ④ 순서대로 실행할 단계들
      - name: Say hello
        run: echo "Hello, GitHub Actions!"
