name: Build and Push Images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push event-ingest
        run: |
          docker build -t decay0116/event-ingest:${{ github.sha }} ./event-ingest
          docker push decay0116/event-ingest:${{ github.sha }}

      - name: Build and push event-aggregator
        run: |
          docker build -t decay0116/event-aggregator:${{ github.sha }} ./event-aggregator
          docker push decay0116/event-aggregator:${{ github.sha }}
